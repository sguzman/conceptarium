[package]
name = "conceptarium"
version = "0.1.0"
edition = "2024"
publish = false
description = "Local Rust tooling and query engine for the Conceptarium knowledge base"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
petgraph = "0.8"
regex = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
surrealdb = { version = "3.2.4", default-features = false, features = ["kv-surrealkv"] }
tantivy = "0.26.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
