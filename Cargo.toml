[package]
name = "conceptarium"
version = "0.1.0"
edition = "2024"
publish = false
description = "Local Rust tooling and query engine for the Conceptarium knowledge base"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
petgraph = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tantivy = "0.26.1"

[dev-dependencies]
tempfile = "3"
