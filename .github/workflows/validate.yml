name: validate-conceptarium

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Compile Rust tooling
        run: cargo check --all-targets

      - name: Run Rust tests
        run: cargo test --all-targets

      - name: Validate registry and canonical entries
        run: cargo run --quiet -- validate

      - name: Build registry-aware disposable projections
        run: cargo run --quiet -- project --output-dir /tmp/conceptarium-projections

      - name: Build Tantivy search index
        run: cargo run --quiet -- index build --path /tmp/conceptarium-tantivy

      - name: Smoke test Tantivy search
        run: cargo run --quiet -- search "humiliation" --engine tantivy --index-path /tmp/conceptarium-tantivy --limit 3

      - name: Build SQLite projection
        run: cargo run --quiet -- sqlite build --path /tmp/conceptarium.sqlite

      - name: Smoke test SQLite query
        run: cargo run --quiet -- sqlite query "SELECT COUNT(*) AS concepts FROM concepts" --path /tmp/conceptarium.sqlite

      - name: Build embedded SurrealDB projection
        run: cargo run --quiet -- surreal build --path /tmp/conceptarium-surreal

      - name: Smoke test SurrealDB concept query
        run: cargo run --quiet -- surreal query "SELECT count() AS concepts FROM concept GROUP ALL" --path /tmp/conceptarium-surreal

      - name: Smoke test SurrealDB relation query
        run: cargo run --quiet -- surreal query "SELECT count() AS relations FROM relation GROUP ALL" --path /tmp/conceptarium-surreal
