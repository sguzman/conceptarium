name: validate-conceptarium

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validator dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate canonical entries
        run: python tools/validate.py

      - name: Build disposable projections
        run: python tools/project.py --output-dir /tmp/conceptarium-projections
